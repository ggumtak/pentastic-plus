name: Build APK

on:
  push:
  workflow_dispatch:
  schedule:
    # 서명 키 캐시는 7일 동안 안 쓰면 GitHub가 지운다. 매주 한 번 꺼내 써서 지워지지 않게 한다.
    - cron: "23 4 * * 1"

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

env:
  KEY_CACHE: pentastic-signing-v1

jobs:
  keep-signing-key:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.pentastic-signing
          key: ${{ env.KEY_CACHE }}

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 고정 서명 키: 처음 한 번만 만들고 이후에는 항상 같은 키로 서명한다.
      # 같은 키로 서명해야 탭에서 삭제 없이 덮어쓰기 업데이트가 된다. 키는 저장소에 올리지 않는다.
      - name: Restore signing key
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/.pentastic-signing
          key: ${{ env.KEY_CACHE }}

      - name: Create signing key (first run only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          KEY_DIR="$HOME/.pentastic-signing"
          mkdir -p "$KEY_DIR"
          openssl rand -hex 24 > "$KEY_DIR/pass.txt"
          P=$(cat "$KEY_DIR/pass.txt")
          keytool -genkeypair -keystore "$KEY_DIR/release.jks" -storetype PKCS12 \
            -alias pentastic -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$P" -keypass "$P" -dname "CN=Pentastic"
          echo "KEY_IS_NEW=1" >> "$GITHUB_ENV"

      - name: Save signing key
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.pentastic-signing
          key: ${{ env.KEY_CACHE }}

      # 저장이 조용히 실패하면 다음 빌드가 다른 키로 서명된다. 확인 못 하면 빌드를 멈춘다.
      - name: Verify signing key is stored
        if: steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.pentastic-signing
          key: ${{ env.KEY_CACHE }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Use signing key
        run: |
          KEY_DIR="$HOME/.pentastic-signing"
          P=$(cat "$KEY_DIR/pass.txt")
          echo "::add-mask::$P"
          {
            echo "SIGNING_KEYSTORE_PATH=$KEY_DIR/release.jks"
            echo "SIGNING_STORE_PASSWORD=$P"
            echo "SIGNING_KEY_PASSWORD=$P"
            echo "SIGNING_KEY_ALIAS=pentastic"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew --no-daemon --refresh-dependencies assembleRelease

      - name: Check signature
        run: |
          cp app/build/outputs/apk/release/app-release.apk pentastic.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs pentastic.apk | tee sig.txt
          FP=$(grep -m1 "certificate SHA-256 digest" sig.txt | awk '{print $NF}')
          test -n "$FP"
          echo "CERT_FP=${FP:0:16}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pentastic-apk
          path: pentastic.apk

      # 태블릿에서 항상 같은 주소(releases/latest/download/pentastic.apk)로 받을 수 있게 올린다.
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="태블릿에서 pentastic.apk를 눌러 내려받아 설치하세요. 기존 앱 위에 그대로 덮어쓰기 설치됩니다."
          if [ "${KEY_IS_NEW:-0}" = "1" ]; then
            NOTE="서명 키가 새로 정해진 빌드입니다. 이번 한 번만 기존 앱을 삭제하고 설치하세요. 다음 버전부터는 덮어쓰기 설치됩니다."
          fi
          # 브라우저 다운로드 폴더에서 예전 파일과 헷갈리지 않게 번호가 붙은 파일도 함께 올린다
          cp pentastic.apk "pentastic-${GITHUB_RUN_NUMBER}.apk"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pentastic.apk "pentastic-${GITHUB_RUN_NUMBER}.apk" \
            --target "$GITHUB_SHA" \
            --title "펜스틱 최신 빌드 #${GITHUB_RUN_NUMBER}" \
            --notes "${NOTE}

          서명 지문: ${CERT_FP} · 커밋: ${GITHUB_SHA::7}" \
            --latest
